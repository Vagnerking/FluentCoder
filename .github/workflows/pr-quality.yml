name: PR Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reviewability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validar tamanho, título e descrição
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/pr-check.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --event "$GITHUB_EVENT_PATH"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:pr-check
      - run: npm run test:unit
      - run: npm run build

  shell-arguments:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Argumentos no PowerShell 7 e Windows PowerShell
        run: node --experimental-strip-types --test src/settings/vscodeShell.test.ts

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dependências Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Compilar testes Rust (sem executar)
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib --no-run
      - name: Executar testes Rust
        timeout-minutes: 10
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib -- --nocapture
      - name: Diagnóstico de carregamento nativo no Windows
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/windows-loader-diagnostics.ps1
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D clippy::correctness -D clippy::await_holding_lock
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: runner.os == 'Windows'
      - run: npm run build
        if: runner.os == 'Windows'
      - name: Build do app real (release GUI no Windows)
        if: runner.os == 'Windows'
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --release --bin fluent-coder
      - name: Build do app real (Linux)
        if: runner.os == 'Linux'
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --bin fluent-coder
      - name: Aceite do runner no ConPTY de release
        timeout-minutes: 10
        if: runner.os == 'Windows'
        env:
          FLUENT_TEST_APP_BINARY: ${{ github.workspace }}/src-tauri/target/release/fluent-coder.exe
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib task_execution::tests::runner_in_real_pty -- --ignored --nocapture
      - name: Aceite do runner no PTY Linux
        timeout-minutes: 10
        if: runner.os == 'Linux'
        env:
          FLUENT_TEST_APP_BINARY: ${{ github.workspace }}/src-tauri/target/debug/fluent-coder
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib task_execution::tests::runner_in_real_pty -- --ignored --nocapture
      - name: Aceite do runner com Windows PowerShell 5.1
        timeout-minutes: 10
        if: runner.os == 'Windows'
        env:
          FLUENT_TEST_APP_BINARY: ${{ github.workspace }}/src-tauri/target/release/fluent-coder.exe
          FLUENT_TEST_RUNNER_SHELL: powershell.exe
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib task_execution::tests::runner_in_real_pty -- --ignored --nocapture
      - name: Fechamento da árvore de tarefas no Windows
        timeout-minutes: 10
        if: runner.os == 'Windows'
        env:
          FLUENT_TEST_APP_BINARY: ${{ github.workspace }}/src-tauri/target/release/fluent-coder.exe
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib terminal::task_runner_tests -- --ignored --nocapture
      - name: Fechamento da árvore de tarefas no Linux
        timeout-minutes: 10
        if: runner.os == 'Linux'
        env:
          FLUENT_TEST_APP_BINARY: ${{ github.workspace }}/src-tauri/target/debug/fluent-coder
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib terminal::task_runner_tests -- --ignored --nocapture
